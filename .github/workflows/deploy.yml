# Rebuilds the static site from the WordPress source and deploys it to
# Cloudflare Workers whenever the content or theme changes on main.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  – "Edit Cloudflare Workers" template token
#   CLOUDFLARE_ACCOUNT_ID – shown on the domain's Overview page in Cloudflare
name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - reddyanna.sql
      - wp-content/**
      - scripts/**
      - wrangler.jsonc
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, mbstring, gd, xml, curl

      - name: Start MySQL
        run: |
          sudo systemctl start mysql
          printf '[client]\nuser=root\npassword=root\n' > ~/.my.cnf
          mysqladmin ping

      - name: Build static site
        run: scripts/build-static.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
